<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video Editor · The Window</title>
  <script>
    const incoming = new URL(location.href);
    const editor = new URL('../studio/', incoming);
    for (const key of ['project', 'shared', 'view']) {
      if (incoming.searchParams.has(key)) editor.searchParams.set(key, incoming.searchParams.get(key));
    }
    location.replace(editor);
  </script>
</head>
<body><a href="../studio/">Open Video Editor</a></body>
</html>
